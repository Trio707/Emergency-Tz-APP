# gradle.properties - Version properties & build config
# DO NOT set org.gradle.java.home here — configure via environment (see TOOLCHAIN.md)

# Build performance
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configureondemand=true

# AndroidX
android.useAndroidX=true

# Suppress AGP/Kotlin compatibility warning (known safe combination)
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true

# Disable default hierarchy template (custom dependsOn)
kotlin.mpp.applyDefaultHierarchyTemplate=false

# Version properties (read by build scripts)
VERSION_NAME=1.0
VERSION_CODE=1