name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45
    # Only run if iosApp directory exists (uncomment when Xcode project is added)
    # if: ${{ hashFiles('iosApp/**') != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          pod repo update

      - name: Configure local.properties
        run: |
          echo "DEBUG_TEST_PHONE_NUMBER=${{ secrets.DEBUG_TEST_PHONE_NUMBER }}" >> local.properties

      - name: Build Compose Multiplatform iOS Framework
        run: |
          chmod +x ./gradlew
          ./gradlew composeApp:linkDebugFrameworkIosArm64
        env:
          DEBUG_TEST_PHONE_NUMBER: ${{ secrets.DEBUG_TEST_PHONE_NUMBER }}

      - name: Build iOS App (Debug)
        if: ${{ hashFiles('iosApp/**') != '' }}
        run: |
          cd iosApp
          xcodebuild -scheme iosApp -configuration Debug -destination generic/platform=iOS -archivePath build/iosApp-Debug.xcarchive archive
          xcodebuild -exportArchive -archivePath build/iosApp-Debug.xcarchive -exportPath build/Debug -exportOptionsPlist ExportOptions.plist

      - name: Build iOS App (Release)
        if: ${{ hashFiles('iosApp/**') != '' }}
        run: |
          cd iosApp
          xcodebuild -scheme iosApp -configuration Release -destination generic/platform=iOS -archivePath build/iosApp-Release.xcarchive archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${{ secrets.IOS_CODE_SIGN_IDENTITY }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROVISIONING_PROFILE }}"
          xcodebuild -exportArchive -archivePath build/iosApp-Release.xcarchive -exportPath build/Release -exportOptionsPlist ExportOptions.plist

      - name: Upload Debug Framework
        uses: actions/upload-artifact@v4
        with:
          name: ios-framework-debug
          path: composeApp/build/bin/iosArm64/debugFramework/
          retention-days: 7

      - name: Upload Release Framework
        uses: actions/upload-artifact@v4
        with:
          name: ios-framework-release
          path: composeApp/build/bin/iosArm64/releaseFramework/
          retention-days: 30

      - name: Upload Debug IPA
        if: ${{ hashFiles('iosApp/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-ipa
          path: iosApp/build/Debug/*.ipa
          retention-days: 7

      - name: Upload Release IPA
        if: ${{ hashFiles('iosApp/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: iosApp/build/Release/*.ipa
          retention-days: 30